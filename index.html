<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizmet Demo</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="triple-logo"><img id="siteLogo1" class="top-logo hidden"><img id="siteLogo2" class="top-logo hidden"><img id="siteLogo3" class="top-logo hidden"></div></header><main>
<section id="home"><div class="home-title"><span class="tag">HİZMET SEÇİMİ</span><h1>Yapmak istediğiniz işlemi seçin</h1></div><div class="service-grid">
<button class="service-card" data-service="hgs"><div class="service-icon">↗</div><h2>HGS Bakiye Yükleme</h2><p>Plaka ve yükleme tutarı ile devam edin.</p><span>Devam Et →</span></button>
<button class="service-card" data-service="km"><div class="service-icon">⌕</div><h2>KM Sorgu - Hasar Sorgu</h2><p>Plaka ile KM / hasar sorgu demo akışına geçin.</p><span>Devam Et →</span></button></div></section>
<section class="card hidden" id="step1"><span class="tag">1 / 3</span><h1 id="flowTitle"></h1><p id="flowDesc" class="muted"></p><label>Plaka</label><input id="plate" placeholder="34 ABC 123"><div id="amountArea"><label>Yüklenecek tutar</label><div class="amounts"><button data-a="500">500 TL</button><button data-a="1000">1.000 TL</button><button data-a="2000">2.000 TL</button><button data-a="3000">3.000 TL</button></div></div><button class="primary" id="next">Devam Et</button><button class="secondary homeBtn">Hizmet Seçimine Dön</button></section>
<section class="card hidden" id="step2"><span class="tag">2 / 3</span><h1>Referans bilgileri</h1><div class="notice"><b>DEMO:</b> Gerçek ödeme veya gerçek sorgulama yapılmaz.</div><label>18 haneli referans numarası</label><input id="ref" maxlength="18" inputmode="numeric"><div class="row"><div><label>Geçerlilik (AA/YY)</label><input id="valid" maxlength="5" placeholder="08/26"></div><div><label>3 haneli işlem kodu</label><input id="code" maxlength="3" inputmode="numeric"></div></div><button class="primary" id="submit">Demo İşlemi Gönder</button><button class="secondary" id="back">Geri</button></section>
<section class="card hidden center" id="step3"><div class="icon">✓</div><span class="tag">3 / 3</span><h1>Demo işlem kaydedildi</h1><p id="resultText"></p><p class="muted">Gerçek ödeme, HGS yüklemesi, KM veya hasar sorgusu yapılmamıştır.</p><button class="primary" id="newSame">Yeni İşlem</button><button class="secondary homeBtn">Hizmet Seçimine Dön</button></section>
</main><footer>Sunum / prototip amaçlıdır</footer><script src="app.js"></script></body></html>
